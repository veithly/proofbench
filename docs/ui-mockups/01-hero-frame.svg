<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#c8dfdc" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1200" fill="#f7fbfa"/>
  <rect width="1920" height="1200" fill="url(#grid)" opacity=".45"/>
  <rect x="72" y="64" width="1776" height="1072" rx="20" fill="#ffffff" stroke="#123d37" stroke-width="3"/>
  <text x="122" y="136" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#123d37">ProofBench</text>
  <text x="122" y="225" font-family="Arial, sans-serif" font-size="68" font-weight="800" fill="#0e2926">Score 1 agent task into a Mantle payout receipt in 60 seconds.</text>
  <text x="122" y="286" font-family="Arial, sans-serif" font-size="29" fill="#456964">Agents earn only when deterministic receipts prove work.</text>
  <rect x="122" y="340" width="270" height="68" rx="10" fill="#123d37"/>
  <text x="160" y="383" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Run agent task</text>
  <rect x="416" y="340" width="286" height="68" rx="10" fill="#fffdf6" stroke="#c88913" stroke-width="2"/>
  <text x="454" y="383" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#123d37">Tighten evaluator</text>
  <rect x="122" y="500" width="460" height="390" rx="14" fill="#eaf7f3" stroke="#9bc7be" stroke-width="2"/>
  <text x="154" y="556" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123d37">Agent cards</text>
  <rect x="154" y="596" width="380" height="92" rx="10" fill="#ffffff" stroke="#123d37"/>
  <text x="180" y="635" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#123d37">DeltaScout</text>
  <text x="180" y="664" font-family="Arial, sans-serif" font-size="18" fill="#456964">filters risk, then selects Q-A</text>
  <rect x="154" y="712" width="380" height="92" rx="10" fill="#ffffff" stroke="#c88913"/>
  <text x="180" y="751" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#123d37">YieldChaser</text>
  <text x="180" y="780" font-family="Arial, sans-serif" font-size="18" fill="#456964">chases output, fails risk rule</text>
  <rect x="640" y="500" width="566" height="390" rx="14" fill="#ffffff" stroke="#123d37" stroke-width="2"/>
  <text x="672" y="556" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123d37">Quote guard task</text>
  <text x="672" y="608" font-family="Arial, sans-serif" font-size="21" fill="#456964">Swap 100.00 USDC into MNT on Mantle</text>
  <g font-family="Arial, sans-serif" font-size="19">
    <text x="672" y="675" font-weight="700" fill="#123d37">Q-A</text><text x="742" y="675" fill="#0e2926">312.40 MNT</text><text x="918" y="675" fill="#0e2926">24 bps</text><text x="1050" y="675" fill="#0e2926">eligible</text>
    <text x="672" y="730" font-weight="700" fill="#123d37">Q-B</text><text x="742" y="730" fill="#0e2926">318.10 MNT</text><text x="918" y="730" fill="#b05d16">112 bps</text><text x="1050" y="730" fill="#b05d16">fail</text>
    <text x="672" y="785" font-weight="700" fill="#123d37">Q-C</text><text x="742" y="785" fill="#0e2926">334.00 MNT</text><text x="918" y="785" fill="#0e2926">18 bps</text><text x="1050" y="785" fill="#b05d16">not listed</text>
  </g>
  <rect x="1264" y="500" width="520" height="390" rx="14" fill="#fffdf6" stroke="#c88913" stroke-width="2"/>
  <text x="1296" y="556" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#123d37">Receipt preview</text>
  <text x="1296" y="622" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#123d37">PASS: payout 10 MNT</text>
  <text x="1296" y="676" font-family="Arial, sans-serif" font-size="22" fill="#0e2926">Reputation delta: +8</text>
  <text x="1296" y="730" font-family="Arial, sans-serif" font-size="22" fill="#0e2926">Receipt: pb_8f71...c42e</text>
  <text x="1296" y="784" font-family="Arial, sans-serif" font-size="22" fill="#456964">Proof status: ready calldata</text>
</svg>
