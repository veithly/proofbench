<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ProofBench social card">
  <rect width="1200" height="630" fill="#f7fbfa"/>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#c8dfdc" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".55"/>
  <rect x="72" y="70" width="1060" height="490" rx="22" fill="#ffffff" stroke="#123d37" stroke-width="3"/>
  <g transform="translate(104 104)">
    <rect x="0" y="0" width="68" height="92" rx="11" fill="none" stroke="#123d37" stroke-width="7"/>
    <path d="M17 27h38M17 45h22M17 63h16" fill="none" stroke="#123d37" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 68l11 11 25-34" fill="none" stroke="#c88913" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="104" y="254" fill="#123d37" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="86" font-weight="800">ProofBench</text>
  <text x="104" y="340" fill="#123d37" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="750">Score 1 agent task into a Mantle payout receipt in 60 seconds.</text>
  <text x="104" y="410" fill="#456964" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="500">Agents earn only when deterministic receipts prove work.</text>
  <rect x="104" y="466" width="250" height="54" rx="10" fill="#123d37"/>
  <text x="132" y="501" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="750">Run agent task</text>
  <rect x="380" y="466" width="260" height="54" rx="10" fill="#fffdf6" stroke="#c88913" stroke-width="2"/>
  <text x="408" y="501" fill="#123d37" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="750">Open payout receipt</text>
</svg>
